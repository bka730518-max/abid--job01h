<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Page</title>
  <style>
    :root{ --bg: #f3f6ff; --card:#ffffff; --accent:#4f46e5; --muted:#6b7280 }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:linear-gradient(135deg,#eef2ff, #ffffff); height:100vh; display:grid; place-items:center}
    .card{width:360px; background:var(--card); padding:28px; border-radius:12px; box-shadow:0 8px 30px rgba(15,23,42,0.08)}
    h1{margin:0 0 8px;font-size:20px}
    p.lead{margin:0 0 18px;color:var(--muted);font-size:14px}

    label{display:block;font-size:13px;margin-bottom:6px;color:#111827}
    .input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e6e9ef;font-size:14px}
    .row{display:flex;gap:10px}
    .actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
    .btn{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .muted{color:var(--muted);font-size:13px}
    .small{font-size:13px}
    .note{background:#f8fafc;border-left:4px solid #e6e9ef;padding:8px 10px;border-radius:6px;margin-top:12px;color:#374151;font-size:13px}

    .footer{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>লগইন</h1>
    <p class="lead">ব্যবহারকারীর নাম ও পাসওয়ার্ড দিয়ে লগইন করুন (ডেমো পেজ)</p>

    <form id="loginForm" autocomplete="off">
      <div style="margin-bottom:12px">
        <label for="username">ইউজার নাম</label>
        <input id="username" class="input" name="username" type="text" placeholder="ইউজার নাম লিখুন" required />
      </div>

      <div style="margin-bottom:8px">
        <label for="password">পাসওয়ার্ড</label>
        <div style="position:relative">
          <input id="password" class="input" name="password" type="password" placeholder="পাসওয়ার্ড" required />
          <button type="button" id="toggle" aria-label="Toggle password" style="position:absolute;right:6px;top:6px;padding:6px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--muted)">দেখাও</button>
        </div>
      </div>

      <div class="actions">
        <label class="small"><input type="checkbox" id="remember" /> মনে রাখুন</label>
        <button class="btn" type="submit">লগইন</button>
      </div>
    </form>

    <div class="note" id="message" style="display:none"></div>

    <div class="footer">ডেমো: ক্লায়েন্ট-সাইড ভেরিফিকেশন — বাস্তবে সার্ভার-সাইড ব্যবহার করুন।</div>
  </main>

  <script>
    // Demo credentials (change or remove for production)
    const DEMO_USERNAME = 'Aysha Siddika';
    const DEMO_PASSWORD = '871246';

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('message');
    const toggle = document.getElementById('toggle');
    const pwd = document.getElementById('password');

    toggle.addEventListener('click', () => {
      if (pwd.type === 'password') { pwd.type = 'text'; toggle.textContent = 'লুকাও'; }
      else { pwd.type = 'password'; toggle.textContent = 'দেখাও'; }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = form.username.value.trim();
      const p = form.password.value;

      // Simple client-side demo check
      if (u === DEMO_USERNAME && p === DEMO_PASSWORD) {
        showMessage('সফল: আপনি লগইন করেছেন।', true);
      } else {
        showMessage('ত্রুটি: ইউজারনেইম বা পাসওয়ার্ড ভুল।', false);
      }
    });

    function showMessage(text, ok){
      msg.style.display = 'block';
      msg.textContent = text;
      msg.style.borderColor = ok ? '#bbf7d0' : '#fecaca';
      msg.style.background = ok ? '#ecfdf5' : '#fff1f2';
      if(ok){ setTimeout(()=>{ msg.textContent = 'রিডাইরেক্ট করা হচ্ছে...'; },800); }
    }
  </script>
</body>
</html>
